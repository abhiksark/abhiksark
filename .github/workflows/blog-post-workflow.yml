name: Latest blog post workflow

on:
  schedule:
    # Every Monday at 05:00 UTC
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with latest posts from abhik.ai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull in posts from abhik.ai RSS
        run: python3 .github/scripts/update_blog.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet Readme.md || (git add Readme.md && git commit -m "chore: refresh recent writing from abhik.ai" && git push)
